<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halloween after</title>
    <script src="main.js" defer></script>
    <script
      src="https://kit.fontawesome.com/c8d62e3e68.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Gugi&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="start">
      <h2 class="start__title">캔디소녀가 양치를 할 수 있게 도와주세요!</h2>
      <button class="start__btn">start</button>
    </div>

    <div class="main">
      <h1 class="main__title">
        캔디소녀의 이빨을<br />
        부탁해
      </h1>
      <button class="main__btn"><i class="far fa-play-circle"></i></button>
    </div>

    <div class="container">
      <button class="puase container__btn">
        <i class="fas fa-pause"></i>
      </button>
      <div class="game-timer">5</div>
      <div class="count">8</div>
      <div class="game-zone"></div>
    </div>

    <div class="pop-up">
      <h2><span class="pop-up__title"></span><br />다시 하시겠습니까?</h2>
      <button class="reloadBtn pop-up__btn">
        <i class="fas fa-redo-alt"></i>
      </button>
    </div>
  </body>
</html>
